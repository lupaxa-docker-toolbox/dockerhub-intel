[build-system]
requires = [
  "setuptools>=77.0.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "lupaxa-dockerhub-intel"
version = "0.1.0-rc1"
description = "Monitor an explicit collection of Docker Hub repositories from the local machine."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = [
  "LICENCE",
]

authors = [
  { name = "The Lupaxa Project" },
]

maintainers = [
  { name = "The Lupaxa Project" },
]

keywords = [
  "cli",
  "docker",
  "dockerhub-intel",
  "python",
  "toolbox",
]

classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development",
]

dependencies = [
  "aiosqlite>=0.20,<1",
  "httpx>=0.28,<1",
  "platformdirs>=4,<5",
  "pydantic>=2.10,<3",
  "rich>=14,<15",
  "ruamel.yaml>=0.18,<0.19",
  "textual>=3,<9",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2.2,<2.0.0",
  "mkdocs==1.6.1",
  "mkdocs-material==9.7.7",
  "mypy>=1.17.0,<2.0.0",
  "pre-commit>=4.2.0,<5.0.0",
  "pytest>=8.4.0,<9.0.0",
  "pytest-asyncio>=1.5,<2",
  "pytest-cov>=6.2.0,<7.0.0",
  "respx>=0.22,<1",
  "ruff>=0.12.0,<1.0.0",
  "twine>=6.1.0,<7.0.0",
  "types-setuptools>=80.1.7,<81.0.0",
]
test = [
  "pytest>=8.4",
  "pytest-asyncio>=1.5,<2",
  "pytest-cov>=5.0",
  "respx>=0.22,<1",
]

[project.urls]
Homepage = "https://github.com/lupaxa-docker-toolbox/dockerhub-intel"
Documentation = "https://dockerhub-intel.thelupaxaproject.org/"
Repository = "https://github.com/lupaxa-docker-toolbox/dockerhub-intel"
Issues = "https://github.com/lupaxa-docker-toolbox/dockerhub-intel/issues"

[project.scripts]
dockerhub-intel = "lupaxa.dockerhub_intel.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = [
  "src",
]
include = [
  "lupaxa.dockerhub_intel*",
]
namespaces = true

[tool.ruff]
target-version = "py311"
line-length = 88
src = [
  "src",
  "tests",
]
extend-exclude = [
  ".mypy_cache",
  ".pytest_cache",
  ".tox",
  ".venv",
  "build",
  "dist",
]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "S",
  "UP",
  "SIM",
  "C4",
  "ISC",
  "D",
  "ANN",
  "PT",
]

ignore = [
  "D200",
  "D201",
  "D202",
  "D203",
  "D204",
  "D205",
  "D206",
  "D207",
  "D208",
  "D209",
  "D210",
  "D211",
  "D212",
  "ISC001",
]

[tool.ruff.lint.per-file-ignores]
"src/lupaxa/dockerhub_intel/cli.py" = [
  "B008",
]
"tests/**/*.py" = [
  "ANN",
  "D",
  "S101",
  "S105",
  "S106",
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = false
ignore-fully-untyped = false
mypy-init-return = true
suppress-dummy-args = false
suppress-none-returning = false

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true
known-first-party = [
  "lupaxa",
]
split-on-trailing-comma = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 88
indent-style = "space"
line-ending = "lf"
quote-style = "double"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
explicit_package_bases = true
files = [
  "src",
  "tests",
]
mypy_path = "src"
strict = true
pretty = true
show_column_numbers = true
show_error_codes = true
show_error_context = true
show_traceback = true
warn_unreachable = true
warn_unused_configs = true
exclude = [
  "^build/",
  "^dist/",
  "^hooks/",
]

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
  "--strict-config",
  "--strict-markers",
  "--showlocals",
  "--tb=short",
]
testpaths = [
  "tests",
]
pythonpath = [
  "src",
]
xfail_strict = true
filterwarnings = [
  "error",
]

[tool.coverage.run]
branch = true
parallel = true
source = [
  "lupaxa.dockerhub_intel",
]

[tool.coverage.paths]
source = [
  "src/lupaxa/dockerhub_intel",
  "*/site-packages/lupaxa/dockerhub_intel",
]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == \"__main__\":",
  "raise AssertionError",
  "raise NotImplementedError",
]
fail_under = 90
precision = 2
show_missing = true
skip_covered = false
skip_empty = true

[tool.coverage.html]
directory = "coverage/html"

[tool.coverage.xml]
output = "coverage/coverage.xml"
